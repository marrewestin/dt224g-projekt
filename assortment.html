<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baka</title>
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <!-- JavaScript -->
    <script src="/js/main.js" defer></script>
    <script src="/js/assortment.js" defer></script>
    <!--Google font-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Akatab:wght@400;500;600;700;800;900&family=Amaranth:ital,wght@0,400;0,700;1,400;1,700&family=Architects+Daughter&family=Bowlby+One&display=swap"
        rel="stylesheet">
</head>

<body>
    <!-- Sidhuvud -->
    <header>
        <!--Logga-->
        <div class="header-wrapper">
            <a href="index.html"><img src="images/logo.png" alt="Baka Logo" class="header-logo"></a>
            <button class="menu-toggle">☰</button>
        </div>

        <!--Meny-->
        <nav class="menu">
            <ul>
                <li><a href="about.html">Om oss</a></li>
                <li class="current"><a href="assortment.html">Sortiment</a></li>
                <li><a href="contact.html">Kontakt</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- Sektion 1: Hero -->
        <section class="hero">
            <div class="transparent">
                <img src="images/logo.png" alt="Baka Logo" class="hero-logo">
                <h1>Vårt sortiment</h1>
            </div>
        </section>

        <!-- Sektion 2: Citat -->
        <section class="quote">
            <h2><span class="handwritten">"Godare än hembakat!"</span></h2>
        </section>

        <!-- Sektion 3: Matbröd / Fikabröd -->
        <div class="grid-wrap2">
            <section id="bread">
                <h2 class="logo-font">Matbröd</h2>
            </section>
            <section id="sweet">
                <h2 class="logo-font">Fikabröd</h2>
            </section>
        </div>
        <section id="articles"></section>
        <section id="sweet2">
            <h2 class="logo-font">Fikabröd</h2>
        </section>
        <section id="articles2"></section>


        <!-- Sektion 4: Öppettider -->
        <section class="section">
            <h2>Öppettider</h2>
            <p>Måndag till fredag: 7:00 - 16:00</p>
            <p>Lördag och söndag: 9:00 - 14:00</p>
        </section>

        <!-- Sidfot -->
        <footer>
            <section id="footer">
                <div id="footer-logo">
                    <img src="images/logo.png" alt="Baka Logo" class="footer-logo">
                </div>
                <div id="footer-adress">
                    <h3>Adress</h3>
                    <p>Bagerigatan 1</p>
                    <p>Bakarstaden</p>
                </div>
                <div id="footer-contact">
                    <h3>Kontakt</h3>
                    <a href="mailto:hej@baka.se">hej@baka.se</a>
                    <p>070-123 45 67</p>
                </div>
            </section>
            <p class="copyright">&copy; 2026 Maria Westin</p>
        </footer>
    </main>

</html>
